<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRP Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div class="mark">GRP</div>
    <div>
      <h1>Ghost Recon Phantoms</h1>
      <p class="sub" id="server"></p>
    </div>
  </header>

  <form id="form" autocomplete="off">
    <label for="name">Nickname</label>
    <input id="name" maxlength="16" spellcheck="false">

    <label for="password">Contraseña</label>
    <input id="password" type="password">
    <button type="button" id="forgot" class="link">¿Olvidaste tu contraseña?</button>

    <label class="check"><input id="create" type="checkbox"> Crear cuenta nueva</label>
    <div id="inviteRow" hidden>
      <label for="invite">Código de invitación</label>
      <input id="invite" spellcheck="false" placeholder="XXXXX-XXXXX">
    </div>

    <details>
      <summary>Opciones</summary>
      <label for="gamedir">Carpeta del juego <span class="hint">(se descarga ahí si falta, unos 4 GB)</span></label>
      <div class="row">
        <input id="gamedir" spellcheck="false">
        <button type="button" id="browse" class="ghost">Buscar</button>
      </div>
      <label for="resolution">Resolución</label>
      <div class="row">
        <select id="resolution"></select>
        <label class="check tight"><input id="windowed" type="checkbox"> En ventana</label>
      </div>
      <label for="mousesens">Sensibilidad del ratón <span class="hint">(exacta; vacío = del juego)</span></label>
      <div class="row" title="Valor exacto de MouseSensitivity en KeyMappingsPC.ini (sin pasos de 0,05). Funciona con o sin mejoras del cliente. Vacío conserva el del juego.">
        <input id="mousesens" type="text" inputmode="decimal" spellcheck="false" placeholder="Sin cambios (del juego)">
        <button type="button" id="sensToggle" class="ghost">Calcular</button>
      </div>
      <div id="sensCalc" class="subpanel" hidden>
        <div class="row">
          <select id="sensFrom">
            <option value="cm360">cm por vuelta (360°)</option>
            <option value="thefinals">The Finals</option>
            <option value="cs2">CS2 / Apex Legends</option>
            <option value="valorant">Valorant</option>
            <option value="ow2">Overwatch 2 / Call of Duty</option>
            <option value="fortnite">Fortnite (%)</option>
            <option value="r6">Rainbow Six Siege</option>
          </select>
        </div>
        <div class="row">
          <div class="col">
            <label for="sensInput" id="sensInputLabel">cm / 360°</label>
            <input id="sensInput" type="text" inputmode="decimal" spellcheck="false" placeholder="30">
          </div>
          <div class="col" id="sensDpiCol">
            <label for="sensDpi">DPI del ratón</label>
            <input id="sensDpi" type="number" min="100" max="32000" step="50" value="800">
          </div>
        </div>
        <div class="row calc-foot">
          <span class="hint" id="sensPreview">Escribe un valor para calcular.</span>
          <button type="button" id="sensApply" class="ghost tight-btn" disabled>Aplicar</button>
        </div>
      </div>
      <label for="maxfps">Mejoras del cliente y límite de FPS</label>
      <div class="row" title="Resoluciones de más de 1920 × 1200 en Opciones > Vídeo del juego, más de 60 FPS, ratón sin límite de giro por fotograma y ajustes de FOV y sensibilidad. Desactivadas, el juego queda como el original.">
        <label class="check tight"><input id="clientmods" type="checkbox"> Activadas</label>
        <select id="maxfps"></select>
      </div>
      <label for="fov">Campo de visión (FOV)</label>
      <div class="row" title="Campo de visión horizontal al caminar o correr (en 16:9). Las miras y telescopios conservan su zoom original.">
        <select id="fov"></select>
      </div>
      <label class="check" title="Escala la sensibilidad al apuntar según la distancia focal real (tan(FOV/2)) en lugar de la curva original del juego.">
        <input id="focallength" type="checkbox"> Escalar sensibilidad al apuntar por distancia focal
      </label>
      <div class="row">
        <div class="col" title="Multiplicador de sensibilidad al apuntar con mira de punto rojo o hierro (0.1 a 3.0; vacío o 1.0 = normal).">
          <label for="adsmult">Multiplicador ADS</label>
          <input id="adsmult" type="number" min="0.1" max="3.0" step="0.05" placeholder="1.0">
        </div>
        <div class="col" title="Multiplicador de sensibilidad con miras telescópicas de francotirador (0.1 a 3.0; vacío o 1.0 = normal).">
          <label for="scopemult">Multiplicador mira</label>
          <input id="scopemult" type="number" min="0.1" max="3.0" step="0.05" placeholder="1.0">
        </div>
      </div>
      <label for="dxvk">Vulkan (DXVK)</label>
      <div class="row" id="dxvkRow" title="El juego dibuja con Vulkan a través de DXVK, como en Linux. Si tu tarjeta gráfica no tiene Vulkan 1.3 o el juego no abre así, se usa DirectX 9.">
        <label class="check tight"><input id="dxvk" type="checkbox"> Activado</label>
        <span class="hint" id="dxvkNote">Si tu tarjeta no tiene Vulkan, el juego usa DirectX 9.</span>
      </div>
    </details>

    <section id="notes" hidden>
      <div class="notes-head">Novedades <span id="notesNew" hidden></span></div>
      <div id="notesList" tabindex="0"></div>
    </section>

    <button id="play" class="primary">JUGAR</button>
  </form>

  <form id="resetForm" autocomplete="off" hidden>
    <p class="intro">Pide un código a un administrador en Discord. Sirve una sola vez y caduca en 24 horas.</p>
    <label for="resetName">Nickname</label>
    <input id="resetName" maxlength="16" spellcheck="false">
    <label for="resetCode">Código</label>
    <input id="resetCode" spellcheck="false" placeholder="XXXXX-XXXXX">
    <label for="resetPassword">Contraseña nueva</label>
    <input id="resetPassword" type="password">
    <label for="resetPassword2">Repite la contraseña nueva</label>
    <input id="resetPassword2" type="password">
    <button type="button" id="resetBack" class="link">Volver</button>
    <button id="resetGo" class="primary">CAMBIAR CONTRASEÑA</button>
  </form>

  <footer>
    <div id="bar" hidden><div id="fill"></div></div>
    <p id="status"></p>
    <p id="version"></p>
  </footer>
</main>
<script src="main.js"></script>
</body>
</html>
