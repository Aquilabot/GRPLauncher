# Builds the Windows launcher (GRPLauncher.exe) from this repository and publishes a GitHub release for version tags.
# It runs only for a version tag pushed by a maintainer, or when a maintainer starts it by hand: never for pull
# requests, so code from a fork is not built or given secrets here.
name: release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build
        working-directory: src-tauri
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp src-tauri/target/release/GRPLauncher.exe launcher.ini LEEME.txt LICENSE dist/
          version="$(grep -oP 'pub const VERSION: u32 = \K[0-9]+' src-tauri/src/core.rs)"
          printf '%s %s\n' "$version" "$(sha256sum dist/GRPLauncher.exe | cut -d' ' -f1)" > dist/version.txt
      - name: Download and verify WebView2 bootstrapper
        shell: pwsh
        run: |
          $out = "dist/MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $out -UseBasicParsing
          $sig = Get-AuthenticodeSignature -FilePath $out
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation') {
            throw "Unexpected WebView2 bootstrapper signature: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          }
      - name: Build NSIS installer
        shell: bash
        run: |
          makensis_bin="$(command -v makensis || true)"
          if [ -z "$makensis_bin" ] && [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            makensis_bin="/c/Program Files (x86)/NSIS/makensis.exe"
          fi
          if [ -z "$makensis_bin" ]; then
            choco install -y nsis --no-progress
            makensis_bin="/c/Program Files (x86)/NSIS/makensis.exe"
          fi
          semver="$(grep -oP '^version = "\K[^"]+' src-tauri/Cargo.toml)"
          "$makensis_bin" \
            -NOCD \
            -INPUTCHARSET UTF8 \
            -DAPP_VERSION="$semver" \
            -DDIST_DIR=dist \
            -DICON_FILE=src-tauri/icons/icon.ico \
            -DWEBVIEW2_BOOTSTRAPPER=MicrosoftEdgeWebview2Setup.exe \
            -DOUT_FILE=dist/GRPLauncher-Setup.exe \
            installer/grplauncher.nsi
          rm -f dist/MicrosoftEdgeWebview2Setup.exe
      - uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: GRPLauncher-unsigned
          path: dist/
      # Code signing (SignPath Foundation), enabled once the project is accepted: the signing request is made for
      # the artifact built above from this commit, and each release is approved by hand in SignPath.
      # Once active, sign GRPLauncher.exe first, then run makensis to pack the signed exe into GRPLauncher-Setup.exe
      # and sign the installer too.
      # - uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: GRPLauncher
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: signed

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: GRPLauncher-unsigned
          path: dist
      - name: Package zip
        run: |
          ( cd dist && zip -q GRPLauncher.zip GRPLauncher.exe launcher.ini LEEME.txt LICENSE )
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          summary="$(git tag -l --format='%(contents)' "$TAG" | sed '/./,$!d')"
          if [ -z "$summary" ]; then
            summary="$(git log -1 --pretty='%B' "$TAG" | sed '/./,$!d')"
          fi
          cat > release-notes.md <<EOF
          ${summary}

          - **Installer (recommended):** \`GRPLauncher-Setup.exe\` installs per-user into \`%LOCALAPPDATA%\GRPLauncher\`, creates shortcuts, and installs Microsoft Edge WebView2 Runtime if missing.
          - **Portable:** \`GRPLauncher.zip\` (extract to a folder and run \`GRPLauncher.exe\`).

          Installed launchers update themselves on their next start.

          Windows build made by the release workflow of this repository (run ${RUN_ID}) from the tag ${TAG}, not signed yet: SmartScreen and antivirus products warn on first run (LEEME.txt explains what to do).

          Code signing policy: see the [README](https://github.com/${REPO}#code-signing-policy). Planned: free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/). Privacy policy: [PRIVACY.md](https://github.com/${REPO}/blob/master/PRIVACY.md).
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/GRPLauncher-Setup.exe dist/GRPLauncher.zip dist/GRPLauncher.exe --clobber
            gh release edit "$TAG" --title "GRPLauncher $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/GRPLauncher-Setup.exe dist/GRPLauncher.zip dist/GRPLauncher.exe \
              --title "GRPLauncher $TAG" \
              --notes-file release-notes.md
          fi
